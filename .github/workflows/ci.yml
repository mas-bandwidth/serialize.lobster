name: ci

on:
  push:
    branches: [main, sprint/serialize-lobster]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on the pinned Lobster
    # THE FORK GUARD: this repository is PUBLIC and these are its own fleet runners, so a
    # pull request from a fork never reaches them (tools/checkci/check-ci.sh holds every job to it).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow invariants
        run: make check-ci

      - name: Corpus directory override (SERIALIZE_CONFORMANCE_DIR) unit test
        run: make check-corpus-dir

      - name: Fetch the pinned Lobster toolchain
        run: make dist-lobster

      - name: Test
        run: make test

      - name: Controls (one refusal rule deleted per control; reversed witnesses)
        run: make controls

      - name: ROADMAP.md is what docs/roadmap.sexp renders
        run: PATH="$HOME/.local/bin:$PATH" make roadmap-check

      - name: Fuzz
        run: if [ -f make/fuzz.mk ]; then make fuzz; fi

      - name: Bench check
        run: if [ -f make/bench.mk ]; then make bench-check; fi

  corpus:
    name: STANDARD.md and conformance/ match the corpus pin
    # THE FORK GUARD: this repository is PUBLIC and these are its own fleet runners, so a
    # pull request from a fork never reaches them (tools/checkci/check-ci.sh holds every job to it).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    env:
      SERIALIZE_REF: v2.0.1
    steps:
      - uses: actions/checkout@v4

      # STANDARD.md, IMPLEMENTING.md, conformance/ and conformance-controls/ are
      # VERBATIM vendored copies (DESIGN.md, "The vendored standard"). They must
      # be the pinned ref's own bytes; a divergence is red, never a skip. The
      # pin is a release tag or a full commit sha, so the ref is fetched, not cloned.
      - name: Check out the reference at the corpus pin
        run: |
          git init --quiet "$RUNNER_TEMP/serialize"
          git -C "$RUNNER_TEMP/serialize" fetch --quiet --depth 1 https://github.com/mas-bandwidth/serialize.git "$SERIALIZE_REF"
          git -C "$RUNNER_TEMP/serialize" checkout --quiet FETCH_HEAD

      - name: The vendored corpus and standard are the pin's
        run: |
          diff -ru "$RUNNER_TEMP/serialize/conformance" conformance
          diff -ru "$RUNNER_TEMP/serialize/conformance-controls" conformance-controls
          diff -ru "$RUNNER_TEMP/serialize/STANDARD.md" STANDARD.md
          diff -ru "$RUNNER_TEMP/serialize/IMPLEMENTING.md" IMPLEMENTING.md
